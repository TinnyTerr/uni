# Every push: does it still typecheck, build, and does the Rust side compile.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

      # The server has no build step, so a syntax check is the whole test.
      - name: Check the sync server parses
        run: |
          bun build server/index.mjs --target=node --outfile=/dev/null
          for f in scripts/*.mjs; do bun build "$f" --target=node --outfile=/dev/null; done

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: System libraries for the webview
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - run: cargo check --manifest-path src-tauri/Cargo.toml
