[package]
name = "uni-schedule"
version = "0.2.0"
description = "University schedule, deadlines and marks tracker"
authors = ["Dav McDonald"]
edition = "2021"

[lib]
name = "uni_schedule_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

# Replacing the installed binary only means anything on a desktop build, so the
# updater and the restart it needs are left out of the mobile targets.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# The menu bar item only exists on macOS, so the tray feature (and the
# appindicator dependency it drags in on Linux) stays out of the other builds.
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
